[z_tilt]
z_positions = 
	-59,150
	362,150
points = 
	50,150
	270,150
speed = 250
horizontal_move_z = 5

[bed_screws]
screw1: 10,15
screw1_name: Front left screw
screw2: 310,15
screw2_name: Front right screw
screw3: 160,305
screw3_name: Rear center screw

[screws_tilt_adjust]
screw1: 10,15
screw1_name: Front left screw
screw2: 310,15
screw2_name: Front right screw
screw3: 160,305
screw3_name: Rear center screw
horizontal_move_z: 5
speed: 250
screw_thread: CW-M3

##############################################################################
# Setup for auto bed mesh calibration
[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 40,40
mesh_max: 280,280
probe_count: 6,6
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 5
split_delta_z: 0.025

################################################################################
# Probe Z offset calibration script
# This script series of commands to automate a probe calibration routine
# [gcode_macro BED_SCREWS_ADJUST]
# rename_existing: BED_SCREWS_ADJUST_BASE
# gcode:
# 	{% set X = params.X|default(160)|float %}
#     {% set Y = params.Y|default(160)|float %}
#     {% set Z = params.Z|default(5)|float %}
#     {% set E = params.E|default(90)|float %}
#     {% set T = params.T|default(235)|float %}
#     _setLedStatusProbing
#     G28
#     Z_TILT_ADJUST
#     BED_SCREWS_ADJUST_BASE

[gcode_macro BED_SCREWS_ADJUST]
description: "Rotina completa de calibração: aquecimento, Z tilt, parafusos e malha"
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set HOTEND = params.HOTEND|default(200)|float %}
    {% set MESH = params.MESH|default(1)|int %}
    {% set SAFE_Z = 10 %}

    M140 S{BED}
    M104 S{HOTEND}
    G28
    G90
    G1 Z{SAFE_Z} F6000

    M190 S{BED}
    M109 S{HOTEND}

    RESPOND PREFIX="info" MSG="🔧 Ajustando eixo Z (Z_TILT_ADJUST)..."
    Z_TILT_ADJUST

    RESPOND PREFIX="info" MSG="🪛 Ajuste dos parafusos da mesa..."
    BED_SCREWS_ADJUST

    RESPOND PREFIX="info" MSG="🔁 Rechecando paralelismo..."
    Z_TILT_ADJUST

    {% if MESH == 1 %}
      RESPOND PREFIX="info" MSG="📊 Gerando nova malha de nivelamento..."
      BED_MESH_CALIBRATE
      SAVE_CONFIG
    {% endif %}

    RESPOND PREFIX="info" MSG="✅ Calibração finalizada com sucesso!"
