####################################################################
# Settings for X-axis stepper motor. 
####################################################################
[stepper_x]
step_pin: PE2
dir_pin: !PB4
enable_pin: !PC11
rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200
# endstop_pin: ^PF3
endstop_pin: PF3
position_min: -19.5
position_endstop: 325
position_max: 326
homing_speed: 75
homing_retract_dist: 5.0
homing_retract_speed: 20
second_homing_speed: 15
