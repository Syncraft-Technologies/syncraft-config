####################################################################
#   Settings for X-axis TMC2209 stepper motor driver. 
####################################################################
[tmc2209 stepper_y]
uart_pin: PF9
interpolate: False
run_current: 1.732
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PF5 

####################################################################
#   Set the given register during the configuration of the TMC2209
#   chip. This may be used to set custom motor parameters. 
####################################################################
# driver_MULTISTEP_FILT: 
# driver_IHOLDDELAY: 
# driver_TPOWERDOWN: 
driver_TBL: 0
driver_TOFF: 3
driver_HEND: 3
driver_HSTRT: 4
driver_PWM_AUTOGRAD: True
driver_PWM_AUTOSCALE: True
# driver_PWM_LIM: 12
driver_PWM_REG: 1
driver_PWM_FREQ: 1
driver_PWM_GRAD: 14
driver_PWM_OFS: 36
# driver_SGTHRS: 0
# driver_SEMIN: 0
# driver_SEUP: 0
# driver_SEMAX: 0
# driver_SEDN: 0
# driver_SEIMIN: 0