
# -----------------------------------------------------------------------------
# Helper macros (logs, guards)
# -----------------------------------------------------------------------------
[gcode_macro _LOG]
description: Internal - send info message
gcode:
  {% set MSG = params.MSG|default("...") %}
  { action_respond_info(MSG) }

[gcode_macro _ENSURE_HOMED_XYZ]
description: Guard - ensure XYZ homed (does safe G28 if needed)
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_respond_info("Homing ausente. Executando G28...") }
    G28
    M400
  {% else %}
    { action_respond_info("Eixos já homed.") }
  {% endif %}

[gcode_macro _ENSURE_TEMPS]
description: Guard - heat bed/nozzle if targets not reached
gcode:
  {% set T_BED = params.T_BED|default(60)|float %}
  {% set T_NOZ = params.T_NOZ|default(205)|float %}
  M140 S{T_BED}
  M104 S{T_NOZ}
  { action_respond_info("Aguardando cama em " ~ T_BED ~ "°C") }
  M190 S{T_BED}
  { action_respond_info("Aguardando bico em " ~ T_NOZ ~ "°C") }
  M109 S{T_NOZ}

[gcode_macro _LOAD_OR_CALIBRATE_MESH]
description: Guard - load mesh profile or calibrate if unavailable
gcode:
  {% set USE_MESH = params.USE_MESH|default(1)|int %}
  {% set PROFILE = params.PROFILE|default("default") %}
  {% set HOT_BED = printer.heater_bed.temperature|float %}
  {% if USE_MESH == 0 %}
    { action_respond_info("Bed mesh desabilitada por parâmetro.") }
    BED_MESH_CLEAR
    G4 P50
  {% else %}
    {% if printer.bed_mesh.profile_name != PROFILE %}
      { action_respond_info("Carregando bed mesh: " ~ PROFILE) }
      BED_MESH_PROFILE LOAD={PROFILE}
    {% else %}
      { action_respond_info("Bed mesh já ativa: " ~ PROFILE) }
    {% endif %}
    {% if printer.bed_mesh.profile_name == "" %}
      { action_respond_info("Perfil ausente. Iniciando BED_MESH_CALIBRATE...") }
      BED_MESH_CALIBRATE
    {% endif %}
  {% endif %}
