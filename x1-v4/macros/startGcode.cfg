
[gcode_macro START_GCODE]
description: Sequência robusta de pré-impressão com checagens e logs
variable_use_mesh: True
variable_mesh_profile: "default"
variable_nozzle_temp: 205
variable_bed_temp: 60
variable_purge_len: 12.0
variable_purge_speed: 6.0
variable_travel_speed: 150.0
variable_purge_xy: "5,5"
gcode:
  {% set use_mesh = params.USE_MESH|default(variable_use_mesh)|bool %}
  {% set mesh_profile = params.MESH_PROFILE|default(variable_mesh_profile) %}
  {% set t_noz = params.T_NOZ|default(variable_nozzle_temp)|float %}
  {% set t_bed = params.T_BED|default(variable_bed_temp)|float %}
  {% set purge_len = params.PURGE_LEN|default(variable_purge_len)|float %}
  {% set purge_speed = (params.PURGE_SPEED|default(variable_purge_speed)|float) * 60 %}
  {% set travel_speed = (params.TRAVEL_SPEED|default(variable_travel_speed)|float) * 60 %}
  {% set purge_xy = (params.PURGE_XY|default(variable_purge_xy)).split(",") %}
  {% set px = purge_xy[0]|float %}
  {% set py = purge_xy[1]|float %}

  { action_respond_info("START_GCODE: iniciando sequência") }

  SET_GCODE_VARIABLE MACRO=AUTO_FILAMENT_CHANGE VARIABLE=isprinting VALUE=1
  UPDATE_DELAYED_GCODE ID=report_temp DURATION=0

  _ENSURE_TEMPS T_BED={t_bed} T_NOZ={t_noz}
  _ENSURE_HOMED_XYZ

  { action_respond_info("Executando Z_TILT_ADJUST") }
  Z_TILT_ADJUST
  M400

  _LOAD_OR_CALIBRATE_MESH USE_MESH={(1 if use_mesh else 0)} PROFILE={mesh_profile}

  G90
  G1 Z5 F{travel_speed}
  G1 X{px} Y{py} F{travel_speed}

  {% if purge_len >= 0 and purge_len <= 60 %}
    { action_respond_info("Purga inicial de " ~ purge_len ~ "mm") }
    G92 E0
    G1 E{purge_len} F{purge_speed}
    G1 Z0.28 F{travel_speed}
    G1 X{px + 40} E{purge_len + 1} F{purge_speed}
    G92 E0
    G1 Z5 F{travel_speed}
  {% else %}
    RESPOND TYPE=error MSG="PURGE_LEN fora do intervalo (0..60)"
  {% endif %}

  PARK_HEAD
  _chamberFlow

  M400
  { action_respond_info("START_GCODE: finalizada") }
