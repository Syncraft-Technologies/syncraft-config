###############################################################################
# START_GCODE (defensivo e robusto a ausências de variable_*)
###############################################################################
[gcode_macro START_GCODE]
description: Sequência robusta de pré-impressão com checagens e logs
# (as linhas variable_* são opcionais – o macro funciona mesmo sem elas)
variable_use_mesh: True
variable_mesh_profile: "default"
variable_nozzle_temp: 205
variable_bed_temp: 60
variable_purge_len: 12.0
variable_purge_speed: 6.0      # mm/s
variable_travel_speed: 150.0   # mm/s
variable_purge_xy: "50,5"       # canto seguro

gcode:
  # --- Defaults sem depender das variable_* ---
  {% set use_mesh_default = 1 %}
  {% set mesh_profile_default = "default" %}
  {% set nozzle_temp_default = 205 %}
  {% set bed_temp_default = 60 %}
  {% set purge_len_default = 12.0 %}
  {% set purge_speed_default = 6.0 %}
  {% set travel_speed_default = 150.0 %}
  {% set purge_xy_default = "5,5" %}

  # --- Leitura de parâmetros (com fallback 100% local) ---
  {% set use_mesh = (params.USE_MESH|default(use_mesh_default)|int) != 0 %}
  {% set mesh_profile = params.MESH_PROFILE|default(mesh_profile_default) %}
  {% set t_noz = params.T_NOZ|default(nozzle_temp_default)|float %}
  {% set t_bed = params.T_BED|default(bed_temp_default)|float %}
  {% set purge_len = params.PURGE_LEN|default(purge_len_default)|float %}
  {% set purge_speed = (params.PURGE_SPEED|default(purge_speed_default)|float) * 60 %}
  {% set travel_speed = (params.TRAVEL_SPEED|default(travel_speed_default)|float) * 60 %}
  {% set purge_xy = (params.PURGE_XY|default(purge_xy_default)).split(",") %}
  {% set px = purge_xy[0]|float %}
  {% set py = purge_xy[1]|float %}

  {% if purge_len < 0 or purge_len > 60 %}
    RESPOND TYPE=error MSG="PURGE_LEN fora do intervalo (0..60)"
  {% else %}
    { action_respond_info("START_GCODE: iniciando sequência") }

    # (opcional) Integrações que podem não existir na sua build
    {% if printer["gcode_macro AUTO_FILAMENT_CHANGE"] is defined %}
      SET_GCODE_VARIABLE MACRO=AUTO_FILAMENT_CHANGE VARIABLE=isprinting VALUE=1
    {% endif %}
    {% if printer["delayed_gcode report_temp"] is defined %}
      UPDATE_DELAYED_GCODE ID=report_temp DURATION=0
    {% endif %}

    # Temperaturas e homing
    _ENSURE_TEMPS T_BED={t_bed} T_NOZ={t_noz}
    _ENSURE_HOMED_XYZ

    # Z-tilt (se existir)
    {% if printer.gcode.commands["Z_TILT_ADJUST"] is defined %}
      { action_respond_info("Executando Z_TILT_ADJUST") }
      Z_TILT_ADJUST
      M400
    {% endif %}

    # Bed mesh (load ou calibrate)
    _LOAD_OR_CALIBRATE_MESH USE_MESH={(1 if use_mesh else 0)} PROFILE={mesh_profile}

    # Movimentos seguros e purga curta
    G90
    G1 Z5 F{travel_speed}
    G1 X{px} Y{py} F{travel_speed}

    { action_respond_info("Purga inicial de " ~ purge_len ~ "mm") }
    G92 E0
    G1 E{purge_len} F{purge_speed}
    G1 Z0.28 F{travel_speed}
    G1 X{px + 40} E{purge_len + 1} F{purge_speed}
    G92 E0
    G1 Z5 F{travel_speed}

    # Estaciona (macro abaixo foi corrigida para não bater em limites)
    PARK_HEAD

    {% if printer["gcode_macro _chamberFlow"] is defined %}
      _chamberFlow
    {% endif %}

    M400
    { action_respond_info("START_GCODE: finalizada") }
  {% endif %}
