###############################################################################
# PARK_HEAD (defensivo) – evita bordas e Z acima do limite
###############################################################################
[gcode_macro PARK_HEAD]
description: Estaciona o cabeçote em posição segura, com retração opcional
# Valores mais conservadores para não encostar na borda
variable_default_x: 325.0
variable_default_y: 300.0
variable_lift_z: 10.0
variable_retract_e: -5.0

gcode:
  {% set X = params.X|default(variable_default_x)|float %}
  {% set Y = params.Y|default(variable_default_y)|float %}
  {% set LZ = params.LZ|default(variable_lift_z)|float %}
  {% set ER = params.ER|default(variable_retract_e)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_respond_info("PARK_HEAD: homing ausente; executando homing rápido de Z") }
    G28 Z
  {% endif %}

  # Limites da máquina
  {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
  {% set zmax = (printer.toolhead.axis_maximum.z if printer.toolhead.axis_maximum is defined else printer.configfile.settings.stepper_z.position_max)|float %}
  {% set curz = printer.toolhead.position.z|float %}

  # Margem de 0.5mm na borda para evitar "move out of range"
  {% set X = min(X, xmax - 0.5) %}
  {% set Y = min(Y, ymax - 0.5) %}

  # Levantamento em Z limitado ao espaço restante
  {% set lift_allowed = max(0.0, min(LZ, zmax - curz - 0.5)) %}

  G91
  G1 E{ER} F3000
  G1 Z{lift_allowed} F1200
  G90
  G1 X{min(280.0, xmax - 0.5)} Y{Y} F18000
  M400
  G1 X{X} F18000
  M400
