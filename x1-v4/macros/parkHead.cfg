[gcode_macro PARK_HEAD]
description: Estaciona o cabeçote em posição segura, com retração opcional
variable_default_x: 330
variable_default_y: 308
variable_lift_z: 10
variable_retract_e: -5
gcode:
  {% set X = params.X|default(variable_default_x)|float %}
  {% set Y = params.Y|default(variable_default_y)|float %}
  {% set LZ = params.LZ|default(variable_lift_z)|float %}
  {% set ER = params.ER|default(variable_retract_e)|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_respond_info("PARK_HEAD: homing ausente; executando homing rápido de Z") }
    G28 Z
  {% endif %}
  {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
  {% if X > xmax %}{% set X = xmax %}{% endif %}
  {% if Y > ymax %}{% set Y = ymax %}{% endif %}
  G91
  G1 E{ER} F3000
  G1 Z{LZ} F1200
  G90
  G1 X{min(280.0, xmax)} Y{Y} F18000
  M400
  G1 X{X} F18000
  M400
