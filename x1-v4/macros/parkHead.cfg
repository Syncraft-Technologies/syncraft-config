###############################################################################
# PARK_HEAD (defensivo) – sem referência direta a variable_*
###############################################################################
[gcode_macro PARK_HEAD]
description: Estaciona o cabeçote em posição segura, com retração opcional
# Os valores abaixo podem ser alterados em runtime via SET_GCODE_VARIABLE
variable_default_x: 325.0
variable_default_y: 300.0
variable_lift_z: 10.0
variable_retract_e: -5.0

gcode:
  # Lê os defaults salvos no objeto da macro (correto no Klipper)
  {% set defx = printer["gcode_macro PARK_HEAD"].default_x|float %}
  {% set defy = printer["gcode_macro PARK_HEAD"].default_y|float %}
  {% set deflz = printer["gcode_macro PARK_HEAD"].lift_z|float %}
  {% set defer = printer["gcode_macro PARK_HEAD"].retract_e|float %}

  # Permite override por parâmetros
  {% set X = params.X|default(defx)|float %}
  {% set Y = params.Y|default(defy)|float %}
  {% set LZ = params.LZ|default(deflz)|float %}
  {% set ER = params.ER|default(defer)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_respond_info("PARK_HEAD: homing ausente; executando homing rápido de Z") }
    G28 Z
  {% endif %}

  # Limites da máquina
  {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
  {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
  {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
  {% set curz = printer.toolhead.position.z|float %}

  # Margem de 0.5 mm nas bordas para evitar 'move out of range'
  {% set X = min(X, xmax - 0.5) %}
  {% set Y = min(Y, ymax - 0.5) %}

  # Levantamento limitado ao espaço restante
  {% set lift_allowed = max(0.0, min(LZ, zmax - curz - 0.5)) %}

  G91
  G1 E{ER} F3000
  G1 Z{lift_allowed} F1200
  G90
  # Split do deslocamento para evitar diagonais longas
  G1 X{min(280.0, xmax - 0.5)} Y{Y} F18000
  M400
  G1 X{X} F18000
  M400
