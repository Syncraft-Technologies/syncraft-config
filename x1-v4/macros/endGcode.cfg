[gcode_macro END_GCODE]
description: Finaliza impressão com retração, resfriamento e estacionamento
gcode:
  {% if printer["gcode_macro _setLedStatusFinished"] is defined %}
    _setLedStatusFinished
  {% endif %}
  TURN_OFF_HEATERS
  M106 S255
  {% if printer["gcode_macro PRIME_ROUTINE"].primed == 1 %}
    G92 E0
    G91
    G1 Z10 E-5 F3000
    M400
  {% endif %}
  G28 Z
  M400
  PARK_HEAD
  M106 S0
  M84
  { action_respond_info("END_GODE: finalizada") }
