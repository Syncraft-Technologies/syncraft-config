[gcode_macro SET_PURGE_LEN]
description: Define e persiste o comprimento de purga padrão
variable_store_key: "purge_len_default"
gcode:
  {% set val = params.LEN|default(20)|float %}
  {% if val < 0 or val > 100 %}
    { action_respond_info("Valor invalido (0..100): " ~ val) }
    RESPOND TYPE=error MSG="LEN fora do intervalo"
  {% else %}
    SAVE_VARIABLE VARIABLE={variable_store_key} VALUE={val}
    { action_respond_info("purge_len_default definido para " ~ val ~ "mm") }
  {% endif %}
