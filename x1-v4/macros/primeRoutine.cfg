[gcode_macro PRIME_ROUTINE]
description: Purga inicial parada + extrusão forte + limpeza do bico (com retorno a X/Y home)
variable_primed: 0

gcode:
  # --- Defaults locais (podem ser sobrescritos na chamada) ---
  {% set PURGE_PUSH  = params.PURGE_PUSH|default(4.0)|float %}
  {% set PURGE_SPEED = params.PURGE_SPEED|default(6.0)|float %}
  {% set FAST_LEN    = params.FAST_LEN|default(60.0)|float %}
  {% set FAST_F      = params.FAST_F|default(750)|float %}
  {% set SLOW_TOTAL  = params.SLOW_TOTAL|default(90.0)|float %}
  {% set SLOW_F      = params.SLOW_F|default(70)|float %}
  {% set RETRACT_MM  = params.RETRACT_MM|default(-8.0)|float %}
  {% set RETRACT_F   = params.RETRACT_F|default(2500)|float %}
  {% set DWELL_MS    = params.DWELL_MS|default(1000)|int %}

  # --- Parâmetros de retorno para X/Y home ---
  {% set END_AT_HOME     = params.END_AT_HOME|default(1)|int %}     # 1=leva para X0 Y0 no fim
  {% set HOME_IF_NEEDED  = params.HOME_IF_NEEDED|default(1)|int %}  # 1=G28 X Y se XY não estiver homed
  {% set HOME_Z_LIFT     = params.HOME_Z_LIFT|default(5.0)|float %} # quanto subir antes de mover para home

  {% set F_PURGE = PURGE_SPEED * 60.0 %}

  # Segurança: não extrudir a frio
  {% if printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: bico não atingiu a temperatura alvo"
  {% else %}
    G1 Z5 F700
    G92 E0

    # Purga parada (garante fluxo)
    {% if PURGE_PUSH > 0 %}
      G1 E{PURGE_PUSH} F{F_PURGE}
      G92 E0
    {% endif %}

    # Extrusão forte e lenta (como na sua versão)
    G1 E{FAST_LEN}   F{FAST_F}
    M118 Estrusão inicial {FAST_LEN}mm...
    G1 E{SLOW_TOTAL} F{SLOW_F}
    G92 E0

    # Retração de segurança
    {% if RETRACT_MM != 0 %} G1 E{RETRACT_MM} F{RETRACT_F} {% endif %}
    M400
    G4 P{DWELL_MS}

    # Limpeza do bico se existir
    {% if printer["gcode_macro _NOZZLE_SCRUB"] is defined %} _NOZZLE_SCRUB {% endif %}

        # ---- Retornar para X/Y home (opcional e clampado) ----
    {% if END_AT_HOME != 0 %}
      G90
      # calcula lift permitido sem passar do zmax - 0.5
      {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
      {% set curz = printer.toolhead.position.z|float %}
      {% set lift_req = HOME_Z_LIFT %}
      {% if lift_req < 0 %}{% set lift_req = 0.0 %}{% endif %}
      {% set z_free = zmax - curz - 0.5 %}
      {% set lift_allowed = lift_req %}
      {% if lift_allowed > z_free %}{% set lift_allowed = z_free %}{% endif %}
      {% if lift_allowed < 0 %}{% set lift_allowed = 0.0 %}{% endif %}

      G1 Z{curz + lift_allowed} F1800

      {% if ("xy" not in printer.toolhead.homed_axes) and (HOME_IF_NEEDED != 0) %}
        G28 X Y
      {% endif %}
      G1 X0 Y0 F9000
    {% endif %}


    # LEDs/flags (só se existirem)
    G1 E0 F900
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    {% if printer["gcode_macro M104"] is defined %} SET_GCODE_VARIABLE MACRO=M104 VARIABLE=isprinting VALUE=1 {% endif %}
    {% if printer["gcode_macro _setLedNozzleIdle"] is defined %} _setLedNozzleIdle {% endif %}
    {% if printer["gcode_macro _setLedPrinting"]  is defined %} _setLedPrinting  {% endif %}
    M400
  {% endif %}
