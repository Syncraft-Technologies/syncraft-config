[gcode_macro PRIME_ROUTINE]
description: Purga completa em X=330 Y=306 (um único deslocamento XY)
variable_primed: 0

gcode:
  # ---- Parâmetros (todos opcionais; pode sobrescrever na chamada) ----
  {% set PURGE_PUSH  = params.PURGE_PUSH|default(4.0)|float %}     # purga parada (mm)
  {% set PURGE_SPEED = params.PURGE_SPEED|default(6.0)|float %}    # mm/s purga parada
  {% set FAST_LEN    = params.FAST_LEN|default(60.0)|float %}      # extrusão rápida (mm)
  {% set FAST_F      = params.FAST_F|default(750)|float %}         # mm/min rápida
  {% set SLOW_TOTAL  = params.SLOW_TOTAL|default(90.0)|float %}    # alvo final do trecho lento (mm)
  {% set SLOW_F      = params.SLOW_F|default(70)|float %}          # mm/min lenta
  {% set RETRACT_MM  = params.RETRACT_MM|default(-8.0)|float %}
  {% set RETRACT_F   = params.RETRACT_F|default(2500)|float %}
  {% set DWELL_MS    = params.DWELL_MS|default(1000)|int %}

  {% set Z_SAFE      = params.Z_SAFE|default(5.0)|float %}         # Z seguro antes da purga
  {% set HOME_IF_NEEDED = params.HOME_IF_NEEDED|default(1)|int %}  # 1=homa XY se necessário

  # ---- Posição-alvo da purga (se quiser mudar, passe END_X/END_Y na chamada) ----
  {% set END_X = params.END_X|default(330.0)|float %}
  {% set END_Y = params.END_Y|default(306.0)|float %}

  # Conversão mm/s -> mm/min p/ feedrate
  {% set F_PURGE = PURGE_SPEED * 60.0 %}

  # ---- Guardas de temperatura ----
  {% if printer.extruder.target|float <= 0 %}
    RESPOND TYPE=error MSG="Defina a temperatura do bico (M109 S...) antes da PRIME_ROUTINE"
  {% elif printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="Bico ainda não atingiu a temperatura alvo"
  {% else %}

    # ---- Preparação: homing e clamps de limites ----
    G90
    {% if ("xy" not in printer.toolhead.homed_axes) and (HOME_IF_NEEDED != 0) %}
      G28 X Y
    {% endif %}

    # Limites da máquina (clamp sem min/max)
    {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
    {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}

    {% set x_edge = xmax - 0.5 %}
    {% set y_edge = ymax - 0.5 %}
    {% if END_X > x_edge %}{% set END_X = x_edge %}{% endif %}
    {% if END_Y > y_edge %}{% set END_Y = y_edge %}{% endif %}
    {% if END_X < 0 %}{% set END_X = 0.0 %}{% endif %}
    {% if END_Y < 0 %}{% set END_Y = 0.0 %}{% endif %}

    {% if Z_SAFE > (zmax - 0.5) %}{% set Z_SAFE = zmax - 0.5 %}{% endif %}
    {% if Z_SAFE < 0 %}{% set Z_SAFE = 0.0 %}{% endif %}

    {% set curz = printer.toolhead.position.z|float %}
    {% if curz < Z_SAFE %}
      G1 Z{Z_SAFE} F1800
    {% endif %}

    ; ÚNICO deslocamento XY: vai ao ponto de purga
    G1 X{END_X} Y{END_Y} F9000

    ; Zera extrusor
    G92 E0

    # ---- Purga parada no ponto (garante fluxo) ----
    {% if PURGE_PUSH > 0 %}
      G1 E{PURGE_PUSH} F{F_PURGE}
      G92 E0
    {% endif %}

    # ---- Extrusão rápida e depois lenta (sem sair do ponto) ----
    G1 E{FAST_LEN}   F{FAST_F}
    M118 Estrusão inicial {FAST_LEN}mm...
    G1 E{SLOW_TOTAL} F{SLOW_F}
    G92 E0

    # ---- Retração + estabilização ----
    {% if RETRACT_MM != 0 %} G1 E{RETRACT_MM} F{RETRACT_F} {% endif %}
    M400
    G4 P{DWELL_MS}

    # ---- Limpeza do bico (se existir) ----
    {% if printer["gcode_macro _NOZZLE_SCRUB"] is defined %}
      _NOZZLE_SCRUB
    {% endif %}

    # ---- Finalização ----
    G1 E0 F900
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    {% if printer["gcode_macro M104"] is defined %} SET_GCODE_VARIABLE MACRO=M104 VARIABLE=isprinting VALUE=1 {% endif %}
    {% if printer["gcode_macro _setLedNozzleIdle"] is defined %} _setLedNozzleIdle {% endif %}
    {% if printer["gcode_macro _setLedPrinting"]  is defined %} _setLedPrinting  {% endif %}
    M400
  {% endif %}
