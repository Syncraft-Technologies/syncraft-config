[gcode_macro PRIME_ROUTINE]
description: Purga completa no canto X0 Y0 (home de X/Y), sem movimentações extras
variable_primed: 0

gcode:
  # ===== Parâmetros (todos opcionais; podem ser passados na chamada) =====
  {% set PURGE_PUSH  = params.PURGE_PUSH|default(4.0)|float %}     # purga parada (mm)
  {% set PURGE_SPEED = params.PURGE_SPEED|default(6.0)|float %}    # mm/s da purga parada
  {% set FAST_LEN    = params.FAST_LEN|default(60.0)|float %}      # extrusão rápida (mm)
  {% set FAST_F      = params.FAST_F|default(750)|float %}         # mm/min da rápida
  {% set SLOW_TOTAL  = params.SLOW_TOTAL|default(90.0)|float %}    # alvo final do trecho lento (mm)
  {% set SLOW_F      = params.SLOW_F|default(70)|float %}          # mm/min da lenta
  {% set RETRACT_MM  = params.RETRACT_MM|default(-8.0)|float %}    # retração final (mm)
  {% set RETRACT_F   = params.RETRACT_F|default(2500)|float %}
  {% set DWELL_MS    = params.DWELL_MS|default(1000)|int %}        # pausa após retrair (ms)

  {% set Z_SAFE      = params.Z_SAFE|default(5.0)|float %}         # Z seguro antes da purga
  {% set HOME_IF_NEEDED = params.HOME_IF_NEEDED|default(1)|int %}  # 1=homa XY se não estiver homed

  # Conversão mm/s -> mm/min p/ feedrate
  {% set F_PURGE = PURGE_SPEED * 60.0 %}

  # ===== Guardas =====
  {% if printer.extruder.target|float <= 0 %}
    RESPOND TYPE=error MSG="Defina a temperatura do bico (M109 S...) antes da PRIME_ROUTINE"
  {% elif printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="Bico ainda não atingiu a temperatura alvo"
  {% else %}

    # ===== Preparação: garantir posição e ir ao canto X0 Y0 uma única vez =====
    G90
    {% if ("xy" not in printer.toolhead.homed_axes) and (HOME_IF_NEEDED != 0) %}
      G28 X Y
    {% endif %}

    # Clamp de Z_SAFE ao limite superior (zmax - 0.5)
    {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
    {% if Z_SAFE > (zmax - 0.5) %}{% set Z_SAFE = zmax - 0.5 %}{% endif %}
    {% if Z_SAFE < 0 %}{% set Z_SAFE = 0.0 %}{% endif %}

    {% set curz = printer.toolhead.position.z|float %}
    {% if curz < Z_SAFE %}
      G1 Z{Z_SAFE} F1800
    {% endif %}

    ; ÚNICO deslocamento XY da macro:
    G1 X0 Y0 F9000

    ; Zera extrusor antes da purga
    G92 E0

    # ===== Purga parada em X0 Y0 =====
    {% if PURGE_PUSH > 0 %}
      G1 E{PURGE_PUSH} F{F_PURGE}
      G92 E0
    {% endif %}

    # ===== Trecho rápido e depois lento (sempre parado em X0 Y0) =====
    G1 E{FAST_LEN}   F{FAST_F}
    M118 Estrusão inicial {FAST_LEN}mm...
    G1 E{SLOW_TOTAL} F{SLOW_F}
    G92 E0

    # ===== Retração e estabilização =====
    {% if RETRACT_MM != 0 %}
      G1 E{RETRACT_MM} F{RETRACT_F}
    {% endif %}
    M400
    G4 P{DWELL_MS}

    # ===== Limpeza do bico (se existir) — continua em X0 Y0 =====
    {% if printer["gcode_macro _NOZZLE_SCRUB"] is defined %}
      _NOZZLE_SCRUB
    {% endif %}

    # ===== Finalização =====
    G1 E0 F900            ; normaliza referência
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    {% if printer["gcode_macro M104"] is defined %} SET_GCODE_VARIABLE MACRO=M104 VARIABLE=isprinting VALUE=1 {% endif %}
    {% if printer["gcode_macro _setLedNozzleIdle"] is defined %} _setLedNozzleIdle {% endif %}
    {% if printer["gcode_macro _setLedPrinting"]  is defined %} _setLedPrinting  {% endif %}
    M400
  {% endif %}
