[gcode_macro PRIME_ROUTINE]
description: Purga inicial + extrusão forte + limpeza do bico
# Parâmetros ajustáveis (podem ser sobrescritos na chamada)
variable_primed: 0
variable_purge_push: 4.0      # mm empurrados PARADO antes de tudo (garante fluxo)
variable_purge_speed: 6.0     # mm/s para essa purga parada
variable_fast_len: 60.0       # mm do primeiro trecho (rápido)
variable_fast_F: 750          # mm/min  (750 ≈ 12.5 mm/s)  — mantém seu valor original
variable_slow_total: 90.0     # mm total ao final do trecho lento (ex.: 90 => +30mm)
variable_slow_F: 70           # mm/min  (mantém seu valor original)
variable_retract_mm: -8.0     # retração ao fim da purga
variable_retract_F: 2500      # mm/min
variable_dwell_ms: 1000       # pausa após retração (ms)

gcode:
  # --- Segurança: não extrudir a frio ---
  {% if printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: bico não atingiu a temperatura alvo para purga"
  {% else %}

    # Zeramos o extrusor e subimos um pouco (compatível com sua versão)
    G1 Z5 F700
    G92 E0

    # --- PURGA INICIAL PARADA (parametrizável) ---
    {% set pre = printer["gcode_macro PRIME_ROUTINE"].purge_push|float %}
    {% set preF = (printer["gcode_macro PRIME_ROUTINE"].purge_speed|float) * 60.0 %}
    {% if pre > 0 %}
      G1 E{pre} F{preF}
      G92 E0
    {% endif %}

    # --- EXTRUSÃO FORTE (mantendo seus valores originais) ---
    {% set fast_len = printer["gcode_macro PRIME_ROUTINE"].fast_len|float %}
    {% set fast_F   = printer["gcode_macro PRIME_ROUTINE"].fast_F|float %}
    G1 E{fast_len} F{fast_F}
    M118 Estrusão inicial {fast_len}mm...

    # --- EXTRUSÃO LENTA ATÉ slow_total (ex.: 90 => +30mm) ---
    {% set slow_total = printer["gcode_macro PRIME_ROUTINE"].slow_total|float %}
    {% set slow_F     = printer["gcode_macro PRIME_ROUTINE"].slow_F|float %}
    G1 E{slow_total} F{slow_F}

    # Zera referência de extrusor
    G92 E0

    # --- RETRAÇÃO (mantendo seu -8 @ 2500) ---
    {% set rmm = printer["gcode_macro PRIME_ROUTINE"].retract_mm|float %}
    {% set rF  = printer["gcode_macro PRIME_ROUTINE"].retract_F|float %}
    G1 E{rmm} F{rF}
    M400
    G4 P{printer["gcode_macro PRIME_ROUTINE"].dwell_ms|int}

    # (Opcional) acelerar temporariamente, se você usava isso
    {% if printer.gcode.commands["M204"] is defined %}
      M204 S5000
    {% endif %}

    # --- LIMPEZA DO BICO (sua macro existente) ---
    _NOZZLE_SCRUB

    # Volta referência no zero (compatível com seu fluxo)
    G1 E0 F900

    # Flags e LEDs (com guardas para evitar erro se não existirem)
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    {% if printer["gcode_macro M104"] is defined %}
      SET_GCODE_VARIABLE MACRO=M104 VARIABLE=isprinting VALUE=1
    {% endif %}
    {% if printer["gcode_macro _setLedNozzleIdle"] is defined %} _setLedNozzleIdle {% endif %}
    {% if printer["gcode_macro _setLedPrinting"]  is defined %} _setLedPrinting  {% endif %}

    # Espera finalizar tudo
    M400
  {% endif %}
