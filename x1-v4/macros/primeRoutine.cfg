###############################################################################
# PRIME_ROUTINE (defensivo) — leitura correta de variable_*
###############################################################################
[gcode_macro PRIME_ROUTINE]
description: Purga controlada e segura antes da impressão
variable_primed: 0
variable_len: 20.0
variable_max_len: 80.0
gcode:
  # Lê os defaults do próprio macro (forma correta no Klipper)
  {% set def_len = printer["gcode_macro PRIME_ROUTINE"].len|float %}
  {% set def_max = printer["gcode_macro PRIME_ROUTINE"].max_len|float %}

  # Parâmetro com fallback nos defaults
  {% set LEN = params.LEN|default(def_len)|float %}
  {% set MAX = def_max %}

  {% if LEN < 0 or LEN > MAX %}
    RESPOND TYPE=error MSG="LEN fora do intervalo (0..{MAX})"
  {% elif printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="Bico não atingiu a temperatura alvo para purga"
  {% else %}
    { action_respond_info("PRIME_ROUTINE: extrudindo " ~ LEN ~ "mm") }
    G92 E0
    G1 E{LEN} F900
    G92 E0
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
  {% endif %}
