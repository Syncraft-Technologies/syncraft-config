###############################################################################
# PRIME_ROUTINE — linha de purga com "desparque" automático
###############################################################################
[gcode_macro PRIME_ROUTINE]
description: Linha de purga + wipe + retração (com desparque de filamento)
variable_primed: 0
variable_len: 18.0
variable_line: 45.0
variable_z: 0.28
variable_speed: 6.0
variable_travel: 150.0
variable_xy: "50,5"           # ← ajuste que você pediu (começar em X=50, Y=5)
variable_wipe: 1
variable_wipe_back: 15.0
variable_retract: -1.0
variable_pre_push: 0.0        # será setado pelo LOAD_FILAMENT (ou via parâmetro)

gcode:
  # Defaults da macro
  {% set def_len   = printer["gcode_macro PRIME_ROUTINE"].len|float %}
  {% set def_line  = printer["gcode_macro PRIME_ROUTINE"].line|float %}
  {% set def_z     = printer["gcode_macro PRIME_ROUTINE"].z|float %}
  {% set def_speed = printer["gcode_macro PRIME_ROUTINE"].speed|float %}
  {% set def_trv   = printer["gcode_macro PRIME_ROUTINE"].travel|float %}
  {% set def_xy    = printer["gcode_macro PRIME_ROUTINE"].xy %}
  {% set def_wipe  = printer["gcode_macro PRIME_ROUTINE"].wipe|int %}
  {% set def_wb    = printer["gcode_macro PRIME_ROUTINE"].wipe_back|float %}
  {% set def_ret   = printer["gcode_macro PRIME_ROUTINE"].retract|float %}
  {% set def_pre   = printer["gcode_macro PRIME_ROUTINE"].pre_push|float %}

  # Parâmetros com override
  {% set LEN      = params.LEN|default(def_len)|float %}
  {% set LINE     = params.LINE|default(def_line)|float %}
  {% set Z_TGT    = params.Z|default(def_z)|float %}
  {% set SPEED    = params.SPEED|default(def_speed)|float %}
  {% set TRAVEL   = params.TRAVEL|default(def_trv)|float %}
  {% set XY_S     = params.XY|default(def_xy) %}
  {% set DO_WIPE  = params.WIPE|default(def_wipe)|int %}
  {% set WIPE_BK  = params.WIPE_BACK|default(def_wb)|float %}
  {% set RETRACT  = params.RETRACT|default(def_ret)|float %}
  {% set PRE      = params.PRE_PUSH|default(def_pre)|float %}    # ← desparque

  {% set px = (XY_S.split(",")[0])|float %}
  {% set py = (XY_S.split(",")[1])|float %}
  {% set F_EXTRUDE = SPEED * 60.0 %}
  {% set F_TRAVEL  = TRAVEL * 60.0 %}

  # Validações
  {% if LEN < 0 or LEN > 120 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: LEN fora de 0..120"
  {% elif LINE < 5 or LINE > 120 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: LINE fora de 5..120"
  {% elif Z_TGT < 0.08 or Z_TGT > 1.0 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: Z inválido (0.08..1.0)"
  {% elif printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="Bico não atingiu a temperatura alvo para purga"
  {% else %}
    {% if printer["gcode_macro _ENSURE_HOMED_XYZ"] is defined %} _ENSURE_HOMED_XYZ {% endif %}

    # Clamps (sem min/max)
    {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
    {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
    {% set x_edge = xmax - 0.5 %}
    {% set y_edge = ymax - 0.5 %}
    {% if px > x_edge %}{% set px = x_edge %}{% endif %}
    {% if py > y_edge %}{% set py = y_edge %}{% endif %}
    {% set x_end = px + LINE %}
    {% if x_end > x_edge %}{% set x_end = x_edge %}{% endif %}
    {% if Z_TGT > (zmax - 0.5) %}{% set Z_TGT = zmax - 0.5 %}{% endif %}

    { action_respond_info(
      "PRIME: (" ~ px ~ "," ~ py ~ "), linha " ~ (x_end - px) ~ "mm, LEN " ~ LEN ~ "mm, PRE_PUSH " ~ PRE ~ "mm"
    ) }

    # Vai para o ponto de início da linha
    G90
    G1 Z5 F{F_TRAVEL}
    G1 X{px} Y{py} F{F_TRAVEL}
    G1 Z{Z_TGT} F{F_TRAVEL}

    # "Desparque": empurra de volta o que foi retraído no LOAD_FILAMENT
    G92 E0
    {% if PRE > 0 %}
      G1 E{PRE} F{F_EXTRUDE}
      # Zera para que a linha use LEN "limpo"
      G92 E0
    {% endif %}

    # Linha de purga
    G1 X{x_end} E{LEN} F{F_EXTRUDE}

    # Wipe opcional
    {% if DO_WIPE != 0 %}
      {% set back = WIPE_BK %}
      {% if back < 0 %}{% set back = 0.0 %}{% endif %}
      {% if (x_end - back) < px %}{% set back = x_end - px %}{% endif %}
      {% if back > 0 %} G1 X{ x_end - back } F{F_TRAVEL} {% endif %}
    {% endif %}

    # Retração opcional
    {% if RETRACT != 0 %} G1 E{RETRACT} F1800 {% endif %}
    G92 E0
    G1 Z{Z_TGT + 1.0} F{F_TRAVEL}

    # Marca e zera o "pre_push" para não repetir sozinho no futuro
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=pre_push VALUE=0.0
  {% endif %}
