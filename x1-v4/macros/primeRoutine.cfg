###############################################################################
# PRIME_ROUTINE — purga integrada + linha + wipe + retração
# - Purga inicial (estática) garante fluxo antes da linha
# - Depois desenha a linha de purga, opcional wipe e retração final
###############################################################################
[gcode_macro PRIME_ROUTINE]
description: Purga inicial + linha de purga segura antes da impressão
# Defaults (ajuste via SET_GCODE_VARIABLE ou parâmetros)
variable_primed: 0
variable_xy: "50,5"          # ponto inicial (você pediu X=50,Y=5)
variable_z: 0.28             # altura da linha
variable_travel: 150.0       # mm/s
variable_speed: 6.0          # mm/s de extrusão para purga/linha

# Purga estática antes da linha (empurra material parado no ponto)
variable_purge_push: 4.0     # mm empurrados parados (garante fluxo)
variable_purge_dwell_ms: 150 # pausa após purga (ms) para estabilizar

# Linha de purga
variable_line: 60.0          # mm de deslocamento em X
variable_len: 20.0           # mm extrudidos ao longo da linha

# Finalização
variable_wipe: 1             # 1=wipe de retorno
variable_wipe_back: 15.0     # mm de wipe
variable_retract: -1.0       # retração final (mm)

gcode:
  # --- Ler defaults da própria macro ---
  {% set def_xy    = printer["gcode_macro PRIME_ROUTINE"].xy %}
  {% set def_z     = printer["gcode_macro PRIME_ROUTINE"].z|float %}
  {% set def_trv   = printer["gcode_macro PRIME_ROUTINE"].travel|float %}
  {% set def_spd   = printer["gcode_macro PRIME_ROUTINE"].speed|float %}
  {% set def_pp    = printer["gcode_macro PRIME_ROUTINE"].purge_push|float %}
  {% set def_pd    = printer["gcode_macro PRIME_ROUTINE"].purge_dwell_ms|int %}
  {% set def_line  = printer["gcode_macro PRIME_ROUTINE"].line|float %}
  {% set def_len   = printer["gcode_macro PRIME_ROUTINE"].len|float %}
  {% set def_wipe  = printer["gcode_macro PRIME_ROUTINE"].wipe|int %}
  {% set def_wb    = printer["gcode_macro PRIME_ROUTINE"].wipe_back|float %}
  {% set def_ret   = printer["gcode_macro PRIME_ROUTINE"].retract|float %}

  # --- Parâmetros (permitem override na chamada) ---
  {% set XY_S   = params.XY|default(def_xy) %}
  {% set Z_TGT  = params.Z|default(def_z)|float %}
  {% set TRAVEL = params.TRAVEL|default(def_trv)|float %}
  {% set SPEED  = params.SPEED|default(def_spd)|float %}

  {% set PURGE_PUSH = params.PURGE_PUSH|default(def_pp)|float %}
  {% set PURGE_DWELL = params.PURGE_DWELL_MS|default(def_pd)|int %}

  {% set LINE  = params.LINE|default(def_line)|float %}
  {% set LEN   = params.LEN|default(def_len)|float %}
  {% set DO_WIPE = params.WIPE|default(def_wipe)|int %}
  {% set WIPE_BK = params.WIPE_BACK|default(def_wb)|float %}
  {% set RETRACT = params.RETRACT|default(def_ret)|float %}

  {% set px = (XY_S.split(",")[0])|float %}
  {% set py = (XY_S.split(",")[1])|float %}
  {% set F_EXTRUDE = SPEED * 60.0 %}
  {% set F_TRAVEL  = TRAVEL * 60.0 %}

  # --- Validações simples ---
  {% if LINE < 5 or LINE > 180 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: LINE fora de 5..180"
  {% elif LEN < 0 or LEN > 150 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: LEN fora de 0..150"
  {% elif Z_TGT < 0.08 or Z_TGT > 1.0 %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: Z inválido (0.08..1.0)"
  {% elif printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="Bico não atingiu a temperatura alvo para purga"
  {% else %}
    {% if printer["gcode_macro _ENSURE_HOMED_XYZ"] is defined %} _ENSURE_HOMED_XYZ {% endif %}

    # --- Clamps sem min()/max() ---
    {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
    {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
    {% set x_edge = xmax - 0.5 %}
    {% set y_edge = ymax - 0.5 %}
    {% if px > x_edge %}{% set px = x_edge %}{% endif %}
    {% if py > y_edge %}{% set py = y_edge %}{% endif %}
    {% set x_end = px + LINE %}
    {% if x_end > x_edge %}{% set x_end = x_edge %}{% endif %}
    {% if Z_TGT > (zmax - 0.5) %}{% set Z_TGT = zmax - 0.5 %}{% endif %}

    { action_respond_info(
      "PRIME: (" ~ px ~ "," ~ py ~ "), purga " ~ PURGE_PUSH ~ "mm, linha " ~ (x_end - px) ~ "mm, LEN " ~ LEN ~ "mm"
    ) }

    # --- Ir ao ponto e descer ---
    G90
    G1 Z5 F{F_TRAVEL}
    G1 X{px} Y{py} F{F_TRAVEL}
    G1 Z{Z_TGT} F{F_TRAVEL}

    # --- PURGA ESTÁTICA (garante fluxo) ---
    G92 E0
    {% if PURGE_PUSH > 0 %}
      G1 E{PURGE_PUSH} F{F_EXTRUDE}
      {% if PURGE_DWELL > 0 %} G4 P{PURGE_DWELL} {% endif %}
      G92 E0
    {% endif %}

    # --- LINHA DE PURGA ---
    G1 X{x_end} E{LEN} F{F_EXTRUDE}

    # --- WIPE (opcional) ---
    {% if DO_WIPE != 0 %}
      {% set back = WIPE_BK %}
      {% if back < 0 %}{% set back = 0.0 %}{% endif %}
      {% if (x_end - back) < px %}{% set back = x_end - px %}{% endif %}
      {% if back > 0 %} G1 X{ x_end - back } F{F_TRAVEL} {% endif %}
    {% endif %}

    # --- RETRAÇÃO FINAL (opcional) ---
    {% if RETRACT != 0 %}
      G1 E{RETRACT} F1800
      G92 E0
    {% endif %}

    # --- Afasta um pouco da peça ---
    G1 Z{Z_TGT + 1.0} F{F_TRAVEL}

    # Flag para END_GCODE (se quiser tratar diferente)
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
  {% endif %}
