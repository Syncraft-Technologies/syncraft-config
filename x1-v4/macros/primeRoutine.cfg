[gcode_macro PRIME_ROUTINE]
description: Purga inicial parada + extrusão forte + limpeza do bico
variable_primed: 0

gcode:
  # --- Defaults locais (podem ser sobrescritos na chamada) ---
  {% set PURGE_PUSH  = params.PURGE_PUSH|default(4.0)|float %}     # mm parados antes de tudo
  {% set PURGE_SPEED = params.PURGE_SPEED|default(6.0)|float %}    # mm/s da purga parada
  {% set FAST_LEN    = params.FAST_LEN|default(60.0)|float %}      # mm trecho rápido
  {% set FAST_F      = params.FAST_F|default(750)|float %}         # mm/min trecho rápido
  {% set SLOW_TOTAL  = params.SLOW_TOTAL|default(90.0)|float %}    # mm alvo total do trecho lento
  {% set SLOW_F      = params.SLOW_F|default(70)|float %}          # mm/min trecho lento
  {% set RETRACT_MM  = params.RETRACT_MM|default(-8.0)|float %}
  {% set RETRACT_F   = params.RETRACT_F|default(2500)|float %}
  {% set DWELL_MS    = params.DWELL_MS|default(1000)|int %}

  # Pré-calcula feedrate da purga parada (mm/s → mm/min)
  {% set F_PURGE = PURGE_SPEED * 60.0 %}

  # Segurança: não extrudir a frio
  {% if printer.extruder.temperature < (printer.extruder.target - 2) %}
    RESPOND TYPE=error MSG="PRIME_ROUTINE: bico não atingiu a temperatura alvo"
  {% else %}
    G1 Z5 F700
    G92 E0

    # Purga parada no ponto (garante fluxo)
    {% if PURGE_PUSH > 0 %}
      G1 E{PURGE_PUSH} F{F_PURGE}
      G92 E0
    {% endif %}

    # Extrusão forte (sua ordem/valores)
    G1 E{FAST_LEN} F{FAST_F}
    M118 Estrusão inicial {FAST_LEN}mm...

    # Extrusão lenta até o total desejado (ex.: 90 => +30mm)
    G1 E{SLOW_TOTAL} F{SLOW_F}
    G92 E0

    # Retração de segurança
    {% if RETRACT_MM != 0 %}
      G1 E{RETRACT_MM} F{RETRACT_F}
    {% endif %}
    M400
    G4 P{DWELL_MS}

    # Limpeza do bico (chama se existir)
    {% if printer["gcode_macro _NOZZLE_SCRUB"] is defined %}
      _NOZZLE_SCRUB
    {% endif %}

    # LEDs (com guardas)
    G1 E0 F900
    SET_GCODE_VARIABLE MACRO=PRIME_ROUTINE VARIABLE=primed VALUE=1
    {% if printer["gcode_macro M104"] is defined %}
      SET_GCODE_VARIABLE MACRO=M104 VARIABLE=isprinting VALUE=1
    {% endif %}
    {% if printer["gcode_macro _setLedNozzleIdle"] is defined %} _setLedNozzleIdle {% endif %}
    {% if printer["gcode_macro _setLedPrinting"]  is defined %} _setLedPrinting  {% endif %}
    M400
  {% endif %}
