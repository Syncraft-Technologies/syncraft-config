
[gcode_macro CANCEL_PRINT]
description: Cancelamento seguro (desliga heaters, estaciona, limpa estado)
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% if printer["gcode_macro _setLedStatusFinished"] is defined %}
    _setLedStatusFinished
  {% endif %}
  TURN_OFF_HEATERS
  M106 S0
  G91
  G1 Z10 F1800
  G90
  PARK_HEAD
  CLEAR_PAUSE
  CANCEL_PRINT_BASE
