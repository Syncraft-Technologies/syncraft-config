[gcode_macro PAUSE]
description: Pause segura (salva estado, estaciona, gerencia temperatura)
rename_existing: PAUSE_BASE
gcode:
  {% set temp = printer.extruder.target %}
  SET_GCODE_VARIABLE MACRO=AUTO_FILAMENT_CHANGE VARIABLE=target_temp VALUE={temp}
  SAVE_GCODE_STATE NAME=PAUSE_state
  PAUSE_BASE
  {% if printer["gcode_macro _setLedStatusPause"] is defined %}
    _setLedStatusPause
  {% endif %}
  PARK_HEAD
